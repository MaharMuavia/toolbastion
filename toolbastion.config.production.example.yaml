version: 1
mode: enforce
profile: strict
project_root: ./
target:
  name: benign-demo
  command: node
  args:
    - ./examples/benign-server/dist/index.js
  cwd: ./
  env_allowlist: []
  isolation:
    provider: docker
    image: node:22-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
    writable_paths: []
    user: 1000:1000
    memory_mb: 512
    cpus: 1
    pids_limit: 256
    tmpfs_size_mb: 64
paths:
  allow: ["./**"]
  deny:
    - "**/.env"
    - "**/.env.*"
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/.azure/**"
    - "**/*credentials*"
    - "**/*secret*"
network:
  default: deny
  allow_domains: []
  allow_subdomains: false
  deny_private_ips: true
  deny_loopback: true
  deny_link_local: true
  deny_metadata_endpoints: true
  allowed_ports: [80, 443]
  target_egress: blocked
tools:
  default: block
  rules:
    echo:
      base_risk: low
      action: allow
capabilities:
  tools:
    echo:
      filesystem: none
      network: none
      command_exec: false
      subprocess: false
      destructive: false
judge:
  enabled: false
  mode: live
receipts:
  enabled: true
  directory: ./.toolbastion/receipts
  signing_required: true
audit:
  directory: ./.toolbastion/audit
  retain_raw_content: false
  signing_required: true
