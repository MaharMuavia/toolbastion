version: 1
mode: enforce
project_root: ./
target:
  name: benign-demo
  command: node
  args:
    - ./examples/benign-server/dist/index.js
  cwd: ./
  env_allowlist: []
paths:
  allow:
    - "./**"
  deny:
    - "**/.env"
    - "**/.env.*"
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/.azure/**"
    - "**/.npmrc"
    - "**/.netrc"
    - "**/.pypirc"
    - "**/.envrc"
    - "**/.git-credentials"
    - "**/.docker/config.json"
    - "**/.kube/config"
    - "**/*credentials*"
    - "**/*secret*"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/*.pfx"
    - "**/*.tfstate"
network:
  default: deny
  allow_domains:
    - api.github.com
  allow_subdomains: false
  deny_private_ips: true
  deny_loopback: true
  deny_link_local: true
  deny_metadata_endpoints: true
  allowed_ports: [80, 443]
  # Use isolated only with the Docker target profile; it gives the target no network namespace.
  target_egress: blocked
tools:
  default: judge
  rules:
    echo:
      base_risk: low
      action: allow
remediation:
  enabled: false
  auto_apply: false
  run_regression_suite: true
