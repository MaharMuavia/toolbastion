version: 1
mode: enforce
project_root: ./
target:
  name: benign-demo
  command: node
  args:
    - ./examples/benign-server/dist/index.js
  cwd: ./
  env_allowlist: []
paths:
  allow:
    - "./**"
  deny:
    - "**/.env"
    - "**/.env.*"
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/.azure/**"
    - "**/.npmrc"
    - "**/.netrc"
    - "**/.pypirc"
    - "**/.envrc"
    - "**/.git-credentials"
    - "**/.docker/config.json"
    - "**/.kube/config"
    - "**/*credentials*"
    - "**/*secret*"
    - "**/id_rsa"
    - "**/id_ed25519"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/*.pfx"
    - "**/*.tfstate"
network:
  default: deny
  allow_domains:
    - api.github.com
  allow_subdomains: false
  deny_private_ips: true
  deny_loopback: true
  deny_link_local: true
  deny_metadata_endpoints: true
  allowed_ports: [80, 443]
  # Legacy topology setting only; it never grants egress authority. Capability
  # contracts below control authorization, and Docker provides no-network containment.
  target_egress: blocked
tools:
  default: judge
  rules:
    echo:
      base_risk: low
      action: allow
capabilities:
  # Every listed target tool needs one reviewed contract before it can execute
  # in enforce mode. Docker containment is required for network-denied,
  # command, subprocess, or destructive capabilities.
  tools:
    echo:
      filesystem: none
      network: none
      command_exec: false
      subprocess: false
      destructive: false
remediation:
  enabled: false
  auto_apply: false
  run_regression_suite: true
receipts:
  enabled: true
  directory: ./.toolbastion/receipts
  signing_required: false
runtime_events:
  # Redacted dashboard lifecycle segments only. Audit JSONL is the durable evidence source.
  max_bytes: 8388608
  retain_files: 2
