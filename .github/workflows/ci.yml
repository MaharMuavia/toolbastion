name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Workspace packages export generated declarations. Build them before
      # type-aware ESLint resolves cross-package imports on a clean runner.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Verify target Docker network isolation
        shell: bash
        run: |
          image_id="$(docker build -q -f examples/vulnerable-server/Dockerfile.isolated .)"
          TOOLBASTION_DOCKER_TEST_IMAGE="${image_id}" npm run test:docker-isolation
      - run: npm run test:e2e
      - run: npm run artifact:prepare
      - run: git diff --exit-code -- apps/dashboard/public/snapshot
      - run: npm audit --audit-level=high
      - name: Secret scan
        shell: bash
        run: |
          if git grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[A-Z0-9]{16}'; then
            echo "Credential-like material found in tracked files"
            exit 1
          fi
