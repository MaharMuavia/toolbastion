name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run evaluate
      - run: npm audit --audit-level=high
      - name: Build release assets
        run: |
          mkdir -p release
          tar -czf release/mcp-warden-${GITHUB_REF_NAME}-linux-x64.tar.gz apps/cli/dist apps/api/dist apps/dashboard/dist packages/*/dist fixtures schemas warden.config.example.yaml package.json package-lock.json
          cp docker-compose.judge.yml docs/judge-guide.md reports/evaluation-summary.json release/
          cd release
          sha256sum * > SHA256SUMS
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: release/*
