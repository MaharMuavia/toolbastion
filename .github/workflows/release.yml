name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Workspace packages export generated declarations. Build them before
      # type-aware ESLint resolves cross-package imports on a clean runner.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Verify target Docker network isolation
        run: npm run test:docker-isolation
      - run: npm run test:e2e
      - run: npm run artifact:prepare
      - run: npm run build:standalone
      - run: npm run pack:smoke
      - run: git diff --exit-code -- apps/dashboard/public/snapshot
      - run: git diff --exit-code
      - name: Verify release evidence identity
        run: node scripts/verify-release-evidence.mjs --commit "${GITHUB_SHA}" --tag "${GITHUB_REF_NAME}" --output release/verification-status.json
      - run: npm audit --audit-level=high
      - name: Secret scan
        shell: bash
        run: |
          if git grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[A-Z0-9]{16}'; then
            echo "Credential-like material found in tracked files"
            exit 1
          fi
      - name: Build release assets
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="toolbastion-${GITHUB_REF_NAME}/" -o "release/toolbastion-${GITHUB_REF_NAME}-source.tar.gz" "${GITHUB_SHA}"
          sed -E "s#ghcr\.io/maharmuavia/toolbastion:v[0-9]+\.[0-9]+\.[0-9]+#ghcr.io/maharmuavia/toolbastion:${GITHUB_REF_NAME}#" docker-compose.judge.yml > release/docker-compose.judge.yml
          grep -F "ghcr.io/maharmuavia/toolbastion:${GITHUB_REF_NAME}" release/docker-compose.judge.yml
          cp docs/judge-guide.md reports/evaluation-summary.json release/
          npm sbom --sbom-format=spdx > release/SBOM.spdx.json
          printf '%s\n' "${GITHUB_SHA}" > release/commit.txt
          cd release
          sha256sum * > SHA256SUMS
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: image
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
      - name: Scan the release image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
      - name: Sign and verify the immutable image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "${DIGEST}"
          printf '%s\n' "${IMAGE}@${DIGEST}" > release/image.txt
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          sha256sum release/image.txt >> release/SHA256SUMS
      - name: Verify anonymous GHCR pull and read-only startup
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          docker logout ghcr.io
          docker pull "${IMAGE}"
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev -p 4782:4782 "${IMAGE}" &
          container_pid=$!
          trap 'kill ${container_pid} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4782/api/health && exit 0; sleep 1; done
          exit 1
      - uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: release/*
