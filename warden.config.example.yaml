version: 1
mode: shadow
project_root: ./
target:
  name: benign-demo
  command: node
  args:
    - ./examples/benign-server/dist/index.js
  cwd: ./
  env_allowlist: []
paths:
  allow:
    - "./**"
  deny:
    - "**/.env"
    - "**/.env.*"
    - "**/.ssh/**"
    - "**/.aws/**"
network:
  default: deny
  allow_domains:
    - api.github.com
  allow_subdomains: false
  deny_private_ips: true
  deny_loopback: true
  deny_link_local: true
  deny_metadata_endpoints: true
  follow_redirects: false
  allowed_ports: [80, 443]
tools:
  default: judge
  rules:
    echo:
      base_risk: low
      action: allow

